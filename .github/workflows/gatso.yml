# CI + déploiement (releases + branche gh-pages) — équivalent de l'ancien .travis.yml
# Dépôts publics: GitHub Actions ne facture pas les minutes Linux (usage standard).

name: GATSO build

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  schedule:
    # Rafraîchissement hebdo des données radars : tous les dimanches à 06h00 UTC.
    - cron: "0 6 * * 0"
  workflow_dispatch: {}

concurrency:
  group: gatso-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Set install channel (mypois, master vs beta)"
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Python venv (Pillow / pandas)
        run: |
          python3 -m venv .ci-venv
          echo "PATH=$GITHUB_WORKSPACE/.ci-venv/bin:$PATH" >> "$GITHUB_ENV"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.ci-venv" >> "$GITHUB_ENV"
          # NB: les variables écrites dans $GITHUB_ENV ne s'appliquent qu'aux steps SUIVANTS.
          # Dans CE step, `python` pointe encore sur le Python système — il faut donc viser
          # explicitement le binaire du venv, sinon pandas/pillow s'installent au mauvais endroit
          # et mypois.py (cible VAG) plante en ModuleNotFoundError aux steps suivants.
          VENV_PY="$GITHUB_WORKSPACE/.ci-venv/bin/python"
          "$VENV_PY" -m pip install -U pip wheel
          "$VENV_PY" -m pip install configparser pandas pillow

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Paquets système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends genisoimage gpsbabel

      - name: Cache sources externes
        uses: actions/cache@v5
        with:
          path: CACHE
          key: gatso-cache-v1-${{ runner.os }}-${{ hashFiles('.github/workflows/gatso.yml') }}
          restore-keys: |
            gatso-cache-v1-${{ runner.os }}-

      - name: Install npm
        run: |
          cd src
          npm ci
          cd ..

      - name: Tests unitaires (node:test)
        run: |
          cd src
          npm test
          cd ..

      - name: Audit des dépendances (informatif)
        continue-on-error: true
        run: |
          cd src
          npm audit --audit-level=high
          cd ..

      - name: Install outils (mypois, GPSBabel)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./bin/make.sh --install-channel=${{ steps.channel.outputs.name }} --install --cache

      - name: Construire les jeux (identique à Travis)
        run: |
          set -eux
          TYP='csv gpx ov2'
          CNX='CNX_GATSO_FR'
          RLS='FR-gatso-'
          ./bin/make.sh --build=hasCache --run --build="$TYP" --build="$CNX" --release-prefix="$RLS"
          ls -lR ./RELEASES
          CNX='CNX_GATSO_FR CNX_GATSO_EU'
          RLS='EU-gatso-'
          ./bin/make.sh --build=hasCache --run --build="$TYP" --build="$CNX" --release-prefix="$RLS"
          ls -lR ./RELEASES
          CNX='CNX_FUEL_FR'
          RLS='FR-fuel-'
          ./bin/make.sh --build=hasCache --run --build="$TYP" --build="$CNX" --release-prefix="$RLS"
          ls -lR ./RELEASES
          CNX='CNX_GATSO_FR CNX_FUEL_FR'
          RLS='FR-gatso-fuel-'
          ./bin/make.sh --build=hasCache --run --build="$TYP" --build="$CNX" --release-prefix="$RLS"
          ls -lR ./RELEASES
          ./bin/make.sh --build=hasCache --run --image
          ls -lR ./RELEASES

      - name: Archive pour déploiement (artefact)
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v7
        with:
          name: gatso-deploy
          if-no-files-found: error
          path: |
            RELEASES
            index.html
            cnx
            src
            BUILD/manifest.txt
            BUILD/version.txt
          retention-days: 2

  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Télécharger l'artefact de build
        uses: actions/download-artifact@v8
        with:
          name: gatso-deploy
          path: .

      - name: Métadonnées release
        id: meta
        env:
          TAG_PREFIX: ${{ secrets.TAG_PREFIX }}
        run: |
          set -eux
          TAG_PREFIX="${TAG_PREFIX:-GATSO-}"
          if [ ! -f BUILD/version.txt ]; then
            echo "BUILD/version.txt manquant"
            exit 1
          fi
          GATSO_UPDATE_MAX=$(date -d @$(cat BUILD/version.txt | sort -n | tail -1) +%Y-%m-%d)
          # Modèle "1 release par version de code" :
          #   - le tag suit la version de src/package.json (ex: v1.2.0) ;
          #   - les runs planifiés (data only) RÉUTILISENT ce tag -> action-gh-release
          #     met à jour la release existante et écrase les assets de même nom
          #     (noms déterministes, ex: FR-gatso-*.zip) ;
          #   - une NOUVELLE release n'apparaît que si la version est bumpée
          #     (= vrai changement de code). Pas d'accumulation de releases datées.
          VERSION=$(jq -r '.version' src/package.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "version introuvable dans src/package.json"
            exit 1
          fi
          TAG="${TAG_PREFIX}v${VERSION}"
          echo "GATSO_UPDATE_MAX=$GATSO_UPDATE_MAX  VERSION=$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=${TAG_PREFIX}v${VERSION} (data ${GATSO_UPDATE_MAX})" >> "$GITHUB_OUTPUT"

      - name: Publier la release (assets dans RELEASES/)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ steps.meta.outputs.release_name }}
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: BUILD/manifest.txt
          fail_on_unmatched_files: false
          make_latest: true
          files: |
            RELEASES/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Préparer le site (GitHub Pages)
        run: |
          set -eux
          mkdir -p _site
          cp -a index.html cnx src RELEASES _site/
          touch _site/.nojekyll
          [ -f .nojekyll ] || true

      - name: Déployer sur gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          force_orphan: true
